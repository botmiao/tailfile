name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go Vet & Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test (with race detector)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test (pure Go)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  cross-compile:
    name: Cross-Compile Desktop & Vet Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build 6 Desktop Targets (CGO_ENABLED=0)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            ldflags="-s -w -X tailfile.local/internal/agent.Version=ci"
            if [ "$os" = "windows" ]; then
              ext=".exe"
              ldflags="${ldflags} -H=windowsgui"
            fi
            out="/tmp/tailfile-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -tags mygo_nowebview -ldflags="$ldflags" -o "$out" .
            test -s "$out"
          done
      - name: Vet Android Core Packages (CGO_ENABLED=0)
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go vet ./internal/agent ./internal/cliflag ./internal/guitoken

  scripts-check:
    name: Validate Installer & Build Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell and Bash scripts
        run: |
          sh -n scripts/install.sh
          bash -n scripts/build-all.sh scripts/install-agent.sh
          shellcheck scripts/install.sh scripts/build-all.sh scripts/install-agent.sh
      - name: Check PowerShell installer AST and ASCII encoding
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('scripts/install.ps1')
          $nonAscii = $bytes | Where-Object { $_ -gt 127 }
          if ($nonAscii.Count -gt 0) {
            throw "Found non-ASCII bytes in scripts/install.ps1"
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | Out-String)
          }
