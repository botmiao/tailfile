name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Release Tag & Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check tag matches mygo.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          base_ver="${tag_ver%%-*}"
          cfg_ver="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' mygo.json | head -n 1)"
          if [ "$base_ver" != "$cfg_ver" ]; then
            echo "Tag base version ($base_ver) does not match mygo.json version ($cfg_ver)"
            exit 1
          fi
      - name: Verify generated Windows resources are up to date
        run: |
          go generate .
          git diff --exit-code rsrc_windows_amd64.syso rsrc_windows_arm64.syso
      - name: Vet & Test
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go test -race -count=1 ./...

  publish:
    name: Build & Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build 6 Desktop Archives & Checksums
        env:
          VERSION: ${{ github.ref_name }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: |
          bash scripts/build-all.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Tailfile ${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}"
