[package]
name = "tailfile-nsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Tailfile Finder-style shell built with Native Shell (nsh)"
license = "Apache-2.0"

[workspace]

[dependencies]
env_logger = "0.11"
hostname = "0.4"
nsh-base = "0.3.0"
nsh-core = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
